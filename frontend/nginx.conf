server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    location /api/ {
        proxy_pass http://api-backend:8000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
